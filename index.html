<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>XY Arena</title>
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <link rel="apple-touch-icon" href="/assets/logo.png" />
    <script>
      (() => {
        const storageKey = "cartesian-game-theme";
        let theme = "dark";
        try {
          const savedTheme = localStorage.getItem(storageKey);
          if (savedTheme === "light" || savedTheme === "dark") theme = savedTheme;
        } catch {
          // Keep the existing dark palette when storage is unavailable.
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <style>
      :root {
        color-scheme: dark;
        --color-canvas: #050b2e;
        --color-surface: #0b1645;
        --color-surface-input: #050a25;
        --color-surface-raised: #12265f;
        --color-text: #eef7ff;
        --color-text-muted: #a7bad8;
        --color-text-subtle: #7187b5;
        --color-border: #21458e;
        --color-border-subtle: #14295e;
        --color-focus: #16e7ff;
        --color-focus-contrast: #050b2e;
        --color-overlay: rgb(0 0 0 / 85%);
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --color-canvas: #eef7ff;
        --color-surface: #ffffff;
        --color-surface-input: #f5f9ff;
        --color-surface-raised: #dcecff;
        --color-text: #08133d;
        --color-text-muted: #405477;
        --color-text-subtle: #60769e;
        --color-border: #9eb9e8;
        --color-border-subtle: #c9dcfa;
        --color-focus: #087ee8;
        --color-focus-contrast: #ffffff;
        --color-overlay: rgb(15 23 42 / 65%);
      }
      html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: var(--color-canvas);
        overflow: auto;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      .app {
        display: grid;
        grid-template-columns: 320px 1fr;
        min-height: 100dvh;
      }
      .left {
        border-right: 1px solid #1e293b;
        padding: 12px;
        color: var(--color-text);
        overflow: auto;
      }
      .right {
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-width: 0;
        padding: 16px;
        gap: 16px;
      }
      textarea, input, button, select {
        width: 100%;
        margin: 4px 0;
        box-sizing: border-box;
        border-radius: 8px;
        border: 1px solid var(--color-border);
        background: var(--color-surface-input);
        color: var(--color-text);
        padding: 8px;
      }
      button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
        outline: 3px solid var(--color-focus);
        outline-offset: 2px;
      }
      .theme-toggle {
        --theme-toggle-inset: 0.25rem;
        --theme-toggle-thumb-size: 2.125rem;
        position: relative;
        display: grid;
        box-sizing: border-box;
        width: 4.75rem;
        height: 2.75rem;
        min-width: 0;
        min-height: 0;
        margin: 0 auto 12px;
        padding: 0;
        border: 1px solid var(--color-border);
        border-radius: 999px;
        background: var(--color-surface-raised);
        color: var(--color-text);
        cursor: pointer;
      }
      .theme-toggle__track {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        pointer-events: none;
      }
      .theme-toggle__icon {
        z-index: 1;
        justify-self: center;
        align-self: center;
        font-size: 1rem;
        line-height: 1;
        opacity: 0.45;
        transition: opacity 160ms ease;
      }
      .theme-toggle__icon--moon { grid-column: 1; opacity: 1; }
      .theme-toggle__icon--sun { grid-column: 2; }
      .theme-toggle__thumb {
        position: absolute;
        z-index: 0;
        inset-block: var(--theme-toggle-inset);
        inset-inline-start: var(--theme-toggle-inset);
        inline-size: var(--theme-toggle-thumb-size);
        block-size: var(--theme-toggle-thumb-size);
        border-radius: 50%;
        background: #0f172a;
        box-shadow: 0 2px 6px rgb(15 23 42 / 45%);
        transition: inset-inline-start 180ms ease, background-color 180ms ease, box-shadow 180ms ease;
      }
      .theme-toggle[aria-pressed="true"] .theme-toggle__thumb,
      :root[data-theme="light"] .theme-toggle__thumb {
        inset-inline-start: 2.25rem;
        background: #facc15;
        box-shadow: 0 2px 8px rgb(250 204 21 / 45%);
      }
      .theme-toggle[aria-pressed="true"] .theme-toggle__icon--moon,
      :root[data-theme="light"] .theme-toggle__icon--moon { opacity: 0.45; }
      .theme-toggle[aria-pressed="true"] .theme-toggle__icon--sun,
      :root[data-theme="light"] .theme-toggle__icon--sun { opacity: 1; }
      @media (prefers-reduced-motion: reduce) {
        .theme-toggle__icon, .theme-toggle__thumb { transition: none; }
      }
      .hidden { display: none; }
      .config-section { margin: 16px 0; }
      .online-form-panel .form-group input {
        min-height: 56px;
        padding: 14px 16px;
        font-size: 18px;
        font-weight: 600;
      }
      #room-code-join {
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      .config-section summary {
        box-sizing: border-box;
        min-height: 48px;
        padding: 14px 16px;
        border: 2px solid var(--color-focus);
        border-radius: 12px;
        background: var(--color-surface-raised);
        color: var(--color-text);
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
      }
      .config-section summary::marker { color: var(--color-focus); }
      .config-section summary:hover, .config-section summary:active,
      .config-section[open] summary { background: var(--color-canvas); }
      .config-section summary:focus-visible, .config-section input:focus-visible {
        outline: 3px solid var(--color-focus);
        outline-offset: 3px;
      }
      .config-fields {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr));
        gap: 16px;
        padding: 16px 0;
      }
      .config-section label {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 0;
        color: var(--color-text);
        font-size: 16px;
        line-height: 1.5;
      }
      .config-section input[type="number"] {
        box-sizing: border-box;
        width: 100%;
        min-width: 0;
        min-height: 48px;
        margin: 0;
        padding: 12px;
        font-size: 16px;
      }
      .config-section label[for="config-mobile-board"] {
        grid-column: 1 / -1;
        flex-direction: row;
        align-items: center;
        min-height: 48px;
        cursor: pointer;
      }
      .config-section input[type="checkbox"] {
        flex: 0 0 24px;
        width: 24px;
        height: 24px;
        margin: 0;
        accent-color: var(--color-focus);
      }
      
      /* Header del juego - estilo marcador NBA */
      .game-header {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        padding: 12px 20px;
        background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
        border-radius: 12px;
        border: 2px solid #334155;
      }
      
      /* Coordenada seleccionada - estilo marcador NBA */
      .coord-display {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }
      .coord-label {
        font-size: 0.75em;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      .coord-value {
        font-size: 2.5em;
        font-weight: 900;
        color: #22d3ee;
        font-family: 'Courier New', monospace;
        text-shadow: 0 0 20px rgba(34, 211, 238, 0.5);
        line-height: 1;
      }
      
      #selection-display.is-correct .coord-label,
      #selection-display.is-correct .coord-value {
        color: #4ade80;
        text-shadow: 0 0 20px rgba(74, 222, 128, 0.45);
      }
      #selection-display.is-error .coord-label,
      #selection-display.is-error .coord-value {
        color: #f87171;
        text-shadow: 0 0 20px rgba(248, 113, 113, 0.45);
      }

      /* Objetivo - centro del header */
      .target-display {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .target-label {
        font-size: 0.75em;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      .target-value {
        font-size: 2.5em;
        font-weight: 900;
        color: #f472b6;
        font-family: 'Courier New', monospace;
        text-shadow: 0 0 20px rgba(244, 114, 182, 0.5);
        line-height: 1;
      }
      
      /* Tiempo - izquierda */
      .time-display {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }
      .game-header .tap-hint { justify-self: end; }
      .time-label {
        font-size: 0.75em;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      .time-value {
        font-size: 2em;
        font-weight: 900;
        color: #facc15;
        font-family: 'Courier New', monospace;
        text-shadow: 0 0 15px rgba(250, 204, 21, 0.5);
      }
      .time-value.urgent {
        color: #ef4444;
        animation: pulse 0.5s infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }

      /* Canvas del juego */
      #game-container {
        width: 100%;
        aspect-ratio: 1 / 1;
        max-height: calc(100dvh - 220px);
        margin: 0 auto;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(34, 211, 238, 0.15);
      }

      /* Tablero opacado cuando ya marcó */
      #game-container.dimmed {
        opacity: 0.3;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }
      /* Panel de estado en modo online */
      .score-panel {
        display: flex;
        justify-content: center;
        gap: 30px;
        padding: 10px;
        background: #1e293b;
        border-radius: 8px;
        margin-top: 8px;
      }
      .score-item {
        text-align: center;
      }
      .score-item label {
        display: block;
        font-size: 0.7em;
        color: #94a3b8;
        text-transform: uppercase;
      }
      .score-item span {
        font-size: 1.2em;
        font-weight: bold;
        color: #22d3ee;
      }

      /* Ranking en vivo - estilo tabla de posiciones */
      .ranking-panel {
        background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
        border: 2px solid #334155;
        border-radius: 12px;
        padding: 16px;
        margin-top: 12px;
      }
      .ranking-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 8px;
        border-bottom: 1px solid #334155;
      }
      .ranking-title {
        font-size: 0.9em;
        font-weight: 700;
        color: #facc15;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      .ranking-live {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.75em;
        color: #4ade80;
      }
      .ranking-live::before {
        content: '';
        width: 8px;
        height: 8px;
        background: #4ade80;
        border-radius: 50%;
        animation: blink 1s infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      .ranking-list {
        list-style: none;
        padding: 0;
        margin: 0;
        max-height: 200px;
        overflow-y: auto;
      }
      .ranking-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 12px;
        margin: 4px 0;
        border-radius: 8px;
        background: rgba(15, 23, 42, 0.5);
        transition: all 0.2s ease;
      }
      .ranking-item.highlight {
        background: linear-gradient(90deg, rgba(34, 211, 238, 0.2) 0%, transparent 100%);
        border: 1px solid #22d3ee;
      }
      .ranking-item.top-3 {
        background: linear-gradient(90deg, rgba(250, 204, 21, 0.15) 0%, transparent 100%);
      }
      .ranking-item.top-3:nth-child(1) {
        background: linear-gradient(90deg, rgba(250, 204, 21, 0.3) 0%, transparent 100%);
      }
      .ranking-pos {
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        font-size: 0.9em;
        border-radius: 50%;
        background: #334155;
        color: #94a3b8;
      }
      .ranking-item:nth-child(1) .ranking-pos {
        background: #facc15;
        color: #0f172a;
        box-shadow: 0 0 10px rgba(250, 204, 21, 0.5);
      }
      .ranking-item:nth-child(2) .ranking-pos {
        background: #94a3b8;
        color: #0f172a;
      }
      .ranking-item:nth-child(3) .ranking-pos {
        background: #cd7f32;
        color: #0f172a;
      }
      .ranking-name {
        flex: 1;
        font-weight: 600;
        color: #e2e8f0;
        margin-left: 12px;
      }
      .ranking-score {
        font-weight: 900;
        font-size: 1.1em;
        color: #22d3ee;
        font-family: 'Courier New', monospace;
      }
      .ranking-empty {
        text-align: center;
        color: #64748b;
        padding: 20px;
        font-style: italic;
      }

      .claim-result-overlay {
        position: fixed;
        inset: 0;
        z-index: 1100;
        display: none;
        place-items: center;
        pointer-events: none;
      }
      .claim-result-overlay.visible { display: grid; }
      .claim-result-card {
        min-width: min(82vw, 320px);
        padding: 28px 32px;
        border: 3px solid var(--color-focus);
        border-radius: 24px;
        background: var(--color-surface);
        box-shadow: 0 16px 50px rgba(15, 23, 42, 0.45);
        text-align: center;
        animation: claim-result-pop 420ms cubic-bezier(0.2, 0.9, 0.3, 1.2);
      }
      .claim-result-card.is-correct { border-color: #4ade80; }
      .claim-result-card.is-error { border-color: #f87171; }
      .claim-result-title {
        margin: 0;
        font-size: clamp(2rem, 8vw, 3rem);
        font-weight: 900;
      }
      .claim-result-card.is-correct .claim-result-title { color: #4ade80; }
      .claim-result-card.is-error .claim-result-title { color: #f87171; }
      .claim-result-detail {
        margin: 8px 0 0;
        color: var(--color-text-muted);
        font-size: 1rem;
      }
      @keyframes claim-result-pop {
        0% { transform: scale(0.7) translateY(16px); opacity: 0; }
        70% { transform: scale(1.05) translateY(0); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .claim-result-card { animation: none; }
      }

      /* Modal de ranking final */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        backdrop-filter: blur(8px);
      }
      .modal-overlay.visible {
        display: flex;
        animation: fadeIn 0.3s ease;
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .modal-content {
        background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
        border: 3px solid #facc15;
        border-radius: 24px;
        padding: 32px;
        max-width: 500px;
        width: 90%;
        max-height: 80vh;
        overflow-y: auto;
        box-shadow: 0 0 60px rgba(250, 204, 21, 0.3);
        animation: slideUp 0.4s ease;
      }
      @keyframes slideUp {
        from { transform: translateY(30px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .modal-title {
        text-align: center;
        font-size: 2em;
        font-weight: 900;
        color: #facc15;
        margin: 0 0 24px 0;
        text-shadow: 0 0 20px rgba(250, 204, 21, 0.5);
      }
      
      /* Podium - top 3 */
      .podium {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        gap: 8px;
        margin-bottom: 24px;
        min-height: 140px;
      }
      .podium-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 12px 16px;
        border-radius: 12px;
        background: rgba(15, 23, 42, 0.8);
        min-width: 80px;
      }
      .podium-1 {
        order: 2;
        background: linear-gradient(180deg, rgba(250, 204, 21, 0.3) 0%, rgba(250, 204, 21, 0.1) 100%);
        border: 2px solid #facc15;
        transform: scale(1.1);
        min-width: 100px;
      }
      .podium-2 {
        order: 1;
        background: linear-gradient(180deg, rgba(148, 163, 184, 0.2) 0%, transparent 100%);
        border: 2px solid #94a3b8;
      }
      .podium-3 {
        order: 3;
        background: linear-gradient(180deg, rgba(205, 127, 50, 0.2) 0%, transparent 100%);
        border: 2px solid #cd7f32;
      }
      .podium-crown {
        font-size: 2em;
        margin-bottom: 4px;
      }
      .podium-pos {
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        font-size: 1em;
        border-radius: 50%;
        background: #334155;
        color: #e2e8f0;
        margin-bottom: 8px;
      }
      .podium-2 .podium-pos { background: #94a3b8; color: #0f172a; }
      .podium-3 .podium-pos { background: #cd7f32; color: #0f172a; }
      .podium-name {
        font-weight: 700;
        font-size: 0.9em;
        color: #e2e8f0;
        text-align: center;
        margin-bottom: 4px;
      }
      .podium-score {
        font-weight: 900;
        font-size: 1.3em;
        color: #22d3ee;
        font-family: 'Courier New', monospace;
      }
      .podium-empty {
        color: #64748b;
        font-style: italic;
      }

      /* Lista ranking (del 4 en adelante) */
      .ranking-list-container {
        margin-bottom: 20px;
        max-height: 200px;
        overflow-y: auto;
      }
      .ranking-list-container .ranking-item {
        background: rgba(15, 23, 42, 0.5);
        border: 1px solid #334155;
      }
      .ranking-list-container .ranking-item.highlight {
        background: linear-gradient(90deg, rgba(34, 211, 238, 0.2) 0%, transparent 100%);
        border-color: #22d3ee;
      }

      /* Botón cerrar modal */
      .modal-close-btn {
        display: block;
        width: 100%;
        padding: 14px 28px;
        font-size: 1.1em;
        font-weight: 700;
        background: linear-gradient(180deg, #475569 0%, #334155 100%);
        color: #e2e8f0;
        border: 2px solid #64748b;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .modal-close-btn:hover {
        background: linear-gradient(180deg, #64748b 0%, #475569 100%);
        border-color: #94a3b8;
      }

      /* Feedback */
      #feedback-text {
        text-align: center;
        padding: 10px;
        font-size: 1.1em;
        min-height: 24px;
      }
      .game-brand {
        display: grid;
        justify-items: center;
        gap: 2px;
        margin: 0 0 8px;
      }
      .game-brand-logo {
        display: block;
        width: min(100%, 220px);
        height: auto;
        max-height: 150px;
        object-fit: contain;
        filter: drop-shadow(0 0 18px rgb(22 231 255 / 24%));
      }
      .connection-status {
        text-align: center;
        color: #94a3b8;
        font-size: 0.85em;
        min-height: 20px;
      }
      .connection-status.connection-error {
        color: #f87171;
      }

      /* Online Entry Menu */
      .online-menu {
        text-align: center;
        padding: 20px 10px;
      }
      .online-menu-title {
        font-size: 1.3em;
        color: #e2e8f0;
        margin: 0 0 8px 0;
      }
      .online-menu-subtitle {
        font-size: 0.9em;
        color: #94a3b8;
        margin: 0 0 20px 0;
      }
      .online-menu-buttons {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .online-menu-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px;
        background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
        border: 2px solid #334155;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .online-menu-btn:hover {
        border-color: #22d3ee;
        transform: translateY(-2px);
      }
      .online-menu-btn.create:hover {
        border-color: #4ade80;
      }
      .online-menu-btn.join:hover {
        border-color: #f472b6;
      }
      .menu-btn-icon {
        font-size: 1.8em;
        margin-bottom: 8px;
      }
      .menu-btn-text {
        font-size: 1.1em;
        font-weight: 700;
        color: #e2e8f0;
      }
      .menu-btn-desc {
        font-size: 0.8em;
        color: #64748b;
        margin-top: 4px;
      }

      /* Online Form Panels */
      .online-form-panel {
        padding: 16px;
      }
      .back-btn {
        background: transparent;
        border: 1px solid #334155;
        color: #94a3b8;
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.9em;
        margin-bottom: 12px;
      }
      .back-btn:hover {
        border-color: #64748b;
        color: #e2e8f0;
      }
      .form-panel-title {
        font-size: 1.2em;
        color: #e2e8f0;
        margin: 0 0 16px 0;
        text-align: center;
      }
      .form-group {
        margin-bottom: 12px;
      }
      .form-group label {
        display: block;
        font-size: 0.85em;
        color: #94a3b8;
        margin-bottom: 6px;
      }
      .action-btn {
        width: 100%;
        padding: 12px;
        font-size: 1em;
        font-weight: 700;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        margin-top: 8px;
      }
      .action-btn.create {
        background: linear-gradient(180deg, #4ade80 0%, #22c55e 100%);
        color: #0f172a;
      }
      .action-btn.join {
        background: linear-gradient(180deg, #f472b6 0%, #ec4899 100%);
        color: #0f172a;
      }
      .action-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      }
      #btn-start-game {
        display: block;
        width: 100%;
        min-height: 56px;
        margin-top: 14px;
        padding: 14px 18px;
        border: 2px solid #facc15;
        border-radius: 12px;
        background: linear-gradient(135deg, #facc15 0%, #f97316 100%);
        color: #431407;
        box-shadow: 0 6px 18px rgba(249, 115, 22, 0.35);
        cursor: pointer;
        font-size: 1.05rem;
        font-weight: 800;
        letter-spacing: 0.02em;
        transition: transform 120ms ease, box-shadow 120ms ease, filter 120ms ease;
      }
      #btn-start-game:hover:not(:disabled) {
        transform: translateY(-2px);
        filter: brightness(1.08);
        box-shadow: 0 9px 24px rgba(249, 115, 22, 0.45);
      }
      #btn-start-game:active:not(:disabled) {
        transform: translateY(0);
        box-shadow: 0 3px 10px rgba(249, 115, 22, 0.3);
      }
      #btn-start-game:focus-visible {
        outline: 3px solid var(--color-focus);
        outline-offset: 3px;
      }
      #btn-start-game:disabled {
        border-color: var(--color-border-subtle);
        background: var(--color-surface-raised);
        color: var(--color-text-muted);
        box-shadow: none;
        cursor: not-allowed;
        filter: saturate(0.35);
      }
      .leave-btn {
        width: 100%;
        padding: 10px;
        background: transparent;
        border: 1px solid #ef4444;
        color: #ef4444;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 10px;
        font-size: 0.9em;
      }
      .leave-btn:hover {
        background: rgba(239, 68, 68, 0.1);
      }

      /* Lobby header con código de sala */
      .lobby-header {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        padding: 16px;
        background: linear-gradient(180deg, rgba(34, 211, 238, 0.1) 0%, transparent 100%);
        border: 2px solid #22d3ee;
        border-radius: 12px;
        margin-bottom: 12px;
      }
      .lobby-code-label {
        font-size: 0.9em;
        color: #94a3b8;
        text-transform: uppercase;
      }
      .lobby-code {
        font-size: 1.8em;
        font-weight: 900;
        color: #22d3ee;
        font-family: 'Courier New', monospace;
        letter-spacing: 0.1em;
        text-shadow: 0 0 15px rgba(34, 211, 238, 0.5);
      }

      /* Instrucciones del modo juego */
      .game-instructions {
        padding: 16px;
        background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
        border: 2px solid #334155;
        border-radius: 12px;
      }
      .instructions-title {
        font-size: 1.1em;
        color: #facc15;
        margin: 0 0 12px 0;
        text-align: center;
      }
      .instructions-list {
        list-style: none;
        padding: 0;
        margin: 0 0 16px 0;
      }
      .instructions-list li {
        padding: 8px 0;
        color: #e2e8f0;
        font-size: 0.9em;
        border-bottom: 1px solid #1e293b;
      }
      .instructions-list li:last-child {
        border-bottom: none;
      }
      .rules-box {
        background: rgba(34, 211, 238, 0.1);
        border: 1px solid #22d3ee;
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 12px;
      }
      .rules-title {
        font-size: 0.9em;
        color: #22d3ee;
        margin: 0 0 8px 0;
      }
      .rules-list {
        list-style: none;
        padding: 0;
        margin: 0;
        font-size: 0.85em;
      }
      .rules-list li {
        padding: 4px 0;
        color: #cbd5e1;
      }
      .tips-box {
        background: rgba(250, 204, 21, 0.1);
        border: 1px solid #facc15;
        border-radius: 8px;
        padding: 12px;
      }
      .tips-title {
        font-size: 0.9em;
        color: #facc15;
        margin: 0 0 6px 0;
      }
      .tips-text {
        font-size: 0.8em;
        color: #94a3b8;
        margin: 0;
        line-height: 1.4;
      }

      .tap-hint {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--color-text-muted);
        font-size: 0.7em;
        line-height: 1.2;
        text-align: right;
      }
      .tap-hint span { color: var(--color-text); font-weight: 700; }
      .tap-hint small { font-size: 0.9em; }
      .tap-hint .tap-demo {
        flex: 0 0 42px;
        width: 42px;
        height: 42px;
        transform: scale(0.66);
        transform-origin: center;
        margin: -11px;
      }
      .tap-hint-copy {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 2px;
      }

      /* Decorative tap demonstration; selection remains on the real board. */
      .tap-instruction {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
        color: var(--color-text);
        font-size: 0.85em;
        line-height: 1.4;
      }
      .tap-instruction p { margin: 0; }
      .tap-demo {
        position: relative;
        flex: 0 0 64px;
        height: 64px;
        pointer-events: none;
        background-image: linear-gradient(var(--color-border) 1px, transparent 1px),
          linear-gradient(90deg, var(--color-border) 1px, transparent 1px);
        background-size: 16px 16px;
      }
      .tap-demo::before {
        content: "";
        position: absolute;
        left: 28px;
        top: 28px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--color-focus);
        animation: tap-point 2s ease-in-out infinite;
      }
      .tap-demo::after {
        content: "";
        position: absolute;
        left: 32px;
        top: 32px;
        width: 18px;
        height: 24px;
        background: var(--color-text);
        clip-path: polygon(0 0, 100% 60%, 60% 65%, 80% 100%, 55% 100%, 35% 70%, 0 90%);
        transform-origin: top left;
        animation: tap-pointer 2s ease-in-out infinite;
      }
      @keyframes tap-pointer {
        0%, 40%, 70%, 100% { transform: scale(1); }
        50%, 60% { transform: scale(0.8); }
      }
      @keyframes tap-point {
        0%, 40%, 80%, 100% { box-shadow: 0 0 0 0 transparent; }
        55%, 65% { box-shadow: 0 0 0 7px var(--color-focus); }
      }
      @media (prefers-reduced-motion: reduce) {
        .tap-demo::before, .tap-demo::after { animation: none; }
      }

      /* Theme consumers use semantic tokens so both palettes stay coherent. */
      .game-header, .ranking-panel, .modal-content, .online-menu-btn, .game-instructions {
        background: linear-gradient(180deg, var(--color-surface) 0%, var(--color-canvas) 100%);
        border-color: var(--color-border);
      }
      .score-panel, .ranking-pos, .podium-pos {
        background: var(--color-surface-raised);
      }
      .ranking-item, .ranking-list-container .ranking-item, .podium-item {
        background: color-mix(in srgb, var(--color-canvas) 70%, transparent);
        border-color: var(--color-border);
      }
      .modal-overlay {
        background: var(--color-overlay);
      }
      .coord-label, .target-label,
      .time-label, .score-item label, .connection-status, .online-menu-subtitle,
      .form-group label, .lobby-code-label, .tips-text {
        color: var(--color-text-muted);
      }
      .online-menu-title, .menu-btn-text, .form-panel-title, .ranking-name,
      .podium-name, .instructions-list li, .podium-pos {
        color: var(--color-text);
      }
      .menu-btn-desc, .ranking-empty, .podium-empty {
        color: var(--color-text-subtle);
      }
      .ranking-header, .instructions-list li {
        border-color: var(--color-border-subtle);
      }
      @media (max-width: 900px) {
        .app { grid-template-columns: 1fr; }
        .left { order: 2; max-height: none; overflow: visible; border-right: 0; border-top: 1px solid var(--color-border-subtle); }
        .right {
          order: 1;
          box-sizing: border-box;
          height: 100vh;
          height: 100dvh;
          min-height: 0;
          grid-template-rows: auto minmax(0, 1fr) auto;
          padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
          gap: 8px;
        }
        .game-header { padding: 8px; gap: 4px; }
        .game-board-space {
          container-type: size;
          min-width: 0;
          min-height: 0;
          display: grid;
          place-items: center;
        }
        .tap-hint { font-size: 0.62em; }
        .coord-label, .target-label, .time-label { font-size: 0.65em; }
        .theme-toggle { align-self: flex-start; }
        #game-container {
          width: min(100cqw, 100cqh);
          height: auto;
          aspect-ratio: 1 / 1;
          max-height: none;
        }
        .coord-value, .target-value { font-size: clamp(1rem, 5vw, 1.8rem); }
        .time-value { font-size: 1.5em; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <section class="left">
        <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false" aria-label="Usar tema claro">
        <span class="theme-toggle__track" aria-hidden="true">
          <span class="theme-toggle__icon theme-toggle__icon--moon">☾</span>
          <span class="theme-toggle__icon theme-toggle__icon--sun">☀</span>
          <span class="theme-toggle__thumb"></span>
        </span>
      </button>
      <script>
        (() => {
          const toggle = document.getElementById("theme-toggle");
          if (!toggle) return;
          const isLight = document.documentElement.dataset.theme === "light";
          toggle.setAttribute("aria-pressed", String(isLight));
          toggle.setAttribute("aria-label", isLight ? "Usar tema oscuro" : "Usar tema claro");
        })();
      </script>
        <div class="game-brand">
          <img class="game-brand-logo" src="/assets/logo.png" alt="XY Arena" />
        </div>
        <p id="connection-status" class="connection-status" role="status">Conectando con la sala...</p>

        <!-- Menú de entrada online -->
          <div id="online-entry-menu" class="online-menu">
            <div class="online-menu-buttons">
              <button id="btn-create-room" class="online-menu-btn create">
                <span class="menu-btn-icon">➕</span>
                <span class="menu-btn-text">Crear Sala</span>
                <span class="menu-btn-desc">Crea una nueva sala y invite a otros</span>
              </button>
              <button id="btn-join-room" class="online-menu-btn join">
                <span class="menu-btn-icon">🔗</span>
                <span class="menu-btn-text">Unirse a Sala</span>
                <span class="menu-btn-desc">Ingresa el código de una sala existente</span>
              </button>
            </div>
          </div>

          <!-- Panel crear sala -->
          <div id="online-create-panel" class="online-form-panel hidden">
            <button id="btn-back-create" class="back-btn">← Volver</button>
            <h3 class="form-panel-title">Crear Nueva Sala</h3>
            <div class="form-group">
              <label for="player-name-create">Tu nombre</label>
              <input id="player-name-create" placeholder="Ingresa tu nombre" />
            </div>
            <details class="config-section">
              <summary>Configurar sala</summary>
              <div class="config-fields">
              <label for="config-max-players">Máximo de jugadores: <input id="config-max-players" type="number" value="8" min="2" max="20" /></label>
              <label for="config-rounds">Cantidad de rondas: <input id="config-rounds" type="number" value="3" min="1" max="10" /></label>
              <label for="config-seconds">Segundos por ronda: <input id="config-seconds" type="number" value="20" min="5" max="120" /></label>
              <label for="config-mobile-board"><input id="config-mobile-board" type="checkbox" role="switch" /> Tablero móvil: rango reducido ±6 (de -6 a 6) para mayor precisión táctil.</label>
              <label for="config-max-xy">Coordenada máxima por eje: <input id="config-max-xy" type="number" value="6" min="1" max="20" /></label>
              </div>
            </details>
            <button id="btn-confirm-create" class="action-btn create">Crear Sala</button>
          </div>

          <!-- Panel unirse a sala -->
          <div id="online-join-panel" class="online-form-panel hidden">
            <button id="btn-back-join" class="back-btn">← Volver</button>
            <h3 class="form-panel-title">Unirse a una Sala</h3>
            <div class="form-group">
              <label for="player-name-join">Tu nombre</label>
              <input id="player-name-join" placeholder="Ingresa tu nombre" />
            </div>
            <div class="form-group">
              <label for="room-code-join">Código de sala</label>
              <input id="room-code-join" placeholder="Código de 6 caracteres" maxlength="6" />
            </div>
            <button id="btn-confirm-join" class="action-btn join">Unirse</button>
          </div>

          <!-- Lobby (visible cuando está en sala) -->
          <div id="online-lobby" class="hidden">
            <div class="lobby-header">
              <span class="lobby-code-label">Sala</span>
              <span class="lobby-code" id="lobby-code-display">—</span>
            </div>
            

            
            <button id="btn-start-game" disabled>🚀 Iniciar partida</button>
            <button id="btn-leave-room" class="leave-btn">Salir de la sala</button>
          </div>

          <!-- Ranking en vivo -->
          <div class="ranking-panel">
            <div class="ranking-header">
              <span class="ranking-title">🏆 Posiciones</span>
              <span class="ranking-live">EN VIVO</span>
            </div>
            <ul class="ranking-list" id="ranking-list">
              <li class="ranking-empty">Sin jugadores aún</li>
            </ul>
          </div>

        <!-- Feedback -->
        <p id="feedback-text"></p>
        
        <!-- Ranking -->
        <div id="ranking-container" class="hidden">
          <strong>Ranking:</strong>
          <ol data-role="ranking"></ol>
        </div>
      </section>
      
      <section class="right">
<!-- Header con coordenada, objetivo y tiempo -->
      <div class="game-header">
        <div class="time-display">
          <span class="time-label">Tiempo</span>
          <span class="time-value" data-role="countdown">—</span>
        </div>
        <div class="target-display">
          <span class="target-label">🎯 Buscá este punto</span>
          <span class="target-value" id="target-coord">(0, 0)</span>
        </div>
        <div class="tap-hint" role="note">
          <span class="tap-demo" aria-hidden="true"></span>
          <span class="tap-hint-copy">
            <span>Toca en el vértice de la cuadrícula</span>
            <small>No arrastres</small>
          </span>
        </div>
      </div>
        
        <!-- Canvas del juego -->
        <div class="game-board-space">
          <div id="game-container"></div>
        </div>
      </section>
    </div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script type="module" src="/src/main.ts"></script>
  </body>
</html>
